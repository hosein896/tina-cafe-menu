<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff1f5"><title>منوی کافه تینا | TINA CAFÉ</title><style>
:root{--bg:#fff6f8;--card:#fffafb;--gold:#ac3868;--text:#522c3d;--border:#f0bfd0;--pink:#e78fb0;--deep:#853356}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
header{text-align:center;background:radial-gradient(ellipse at top,#ffe5ee,#f8bdd1 85%);padding:62px 18px 50px;border-bottom:1px solid #e99eb8}
.brand{font:44px Georgia,serif;letter-spacing:5px;color:#8f3159;direction:ltr}
.line{height:2px;width:90px;background:#a84670;margin:20px auto}
.tag{color:#75465c;font-size:13px;line-height:2}
main{max-width:920px;margin:auto;padding:25px 16px}
input{width:100%;border:1px solid #e8abc0;background:#fff;color:#542c3e;padding:16px;border-radius:14px;font:inherit;outline:none;box-shadow:0 3px 14px #bc527014}
input:focus{border-color:#be5981;box-shadow:0 0 0 3px #ecb0c844}
input::placeholder{color:#a27688}
.tabs{display:flex;overflow-x:auto;gap:9px;margin:22px 0 30px;padding-bottom:10px;scrollbar-width:thin}
.tabs button{flex:none;padding:11px 17px;background:#ffe5ee;border:1px solid #eab0c5;color:#7e3b59;border-radius:40px;font:inherit;cursor:pointer}
.tabs button.active{background:#a93f6b;border-color:#a93f6b;color:white}
h2{color:#92385e;font-size:22px;border-bottom:1px solid #e9b2c6;padding-bottom:13px;margin-top:35px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:linear-gradient(135deg,#fff,#ffebf1);border:1px solid #f0c4d3;border-radius:17px;padding:20px;min-height:120px;box-shadow:0 5px 20px #c26a8713}
.name{font-size:16px;font-weight:bold;line-height:1.9;color:#55283d}
.desc{font-size:12px;color:#8d6675;line-height:2;margin-top:8px}
.price{font-size:19px;font-weight:bold;color:#a83d69;margin-top:13px}
.price small{font-size:12px;font-weight:normal}
.status{text-align:center;padding:28px 15px;line-height:2;color:#884663}
.reload{border:1px solid #c67394;color:white;background:#aa4a72;border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit}
footer{text-align:center;border-top:1px solid #edb8c9;margin-top:45px;padding:35px 16px;color:#9c5a75;font:14px Georgia,serif;background:#ffe7ef}
.hint{font:11px Tahoma;color:#9b7282;margin-top:10px;text-align:center}
@media(max-width:600px){.grid{grid-template-columns:1fr}.brand{font-size:35px}}
</style></head><body><header><div class="brand">TINA CAFÉ</div><div class="line"></div><b>کافه تینا</b><div class="tag">طعم لحظه‌های خوب، در کنار شما</div></header><main><input id="search" type="search" placeholder="جست‌وجو در منو…" aria-label="جست‌وجوی محصولات"><div id="tabs" class="tabs"></div><div id="menu" class="status">در حال دریافت قیمت‌های روز…</div><p class="hint">قیمت‌ها از منوی رسمی کافه تینا دریافت می‌شوند.</p></main><footer>TINA CAFÉ · MADE WITH ♥</footer><script>
// شناسه فایل Google Sheets و شناسه تب Menu. تغییر سایر فایل‌ها لازم نیست.
const SHEET_ID='1jmlf9eFrubuU2lnmM-8eWaxOT7GVzCZc0IbEC3GY6PU';
const SHEET_GID='348634307';
let products=[], category='همه', loaded=false;
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const faDigits=s=>String(s).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));
function parsePrice(v){return Number(faDigits(String(v??0)).replace(/[^\d.-]/g,''))||0}
function showError(){if(loaded)return;document.getElementById('menu').innerHTML='<div class="status">دریافت منو انجام نشد.<br>مالک کافه باید فایل Google Sheets را برای مشاهده عمومی (Viewer) منتشر کند و شناسه فایل را بررسی کند.<br><br><button class="reload" onclick="location.reload()">تلاش دوباره</button></div>'}
function tinaReceive(response){if(response.status!=='ok'||!response.table){showError();return}const rows=response.table.rows||[];products=rows.map(r=>{let c=r.c||[];const val=i=>(c[i]?(c[i].v??c[i].f??''):'');return {cat:String(val(0)).trim(),name:String(val(1)).trim(),price:parsePrice(val(2)),desc:String(val(3)).trim()}}).filter(x=>x.cat&&x.name);loaded=true;if(!products.length){document.getElementById('menu').innerHTML='<div class="status">محصولی در شیت پیدا نشد.</div>';return}draw()}
function draw(){const q=document.getElementById('search').value.trim().toLocaleLowerCase('fa');const cats=['همه',...new Set(products.map(p=>p.cat))];document.getElementById('tabs').innerHTML=cats.map(c=>`<button type="button" class="${c===category?'active':''}" data-cat="${escapeHTML(c)}">${escapeHTML(c)}</button>`).join('');const filtered=products.filter(x=>(category==='همه'||x.cat===category)&&(x.name+' '+x.desc).toLocaleLowerCase('fa').includes(q));const group=[...new Set(filtered.map(x=>x.cat))];document.getElementById('menu').className='';document.getElementById('menu').innerHTML=group.length?group.map(c=>`<section><h2>${escapeHTML(c)}</h2><div class="grid">${filtered.filter(x=>x.cat===c).map(x=>`<article class="card"><div class="name">${escapeHTML(x.name)}</div>${x.desc?`<div class="desc">${escapeHTML(x.desc)}</div>`:''}<div class="price">${new Intl.NumberFormat('fa-IR').format(x.price/1000)} <small>هزار تومان</small></div></article>`).join('')}</div></section>`).join(''):'<div class="status">محصولی پیدا نشد.</div>'}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){category=b.dataset.cat;draw()}});document.getElementById('search').addEventListener('input',draw);
const s=document.createElement('script');s.src=`https://docs.google.com/spreadsheets/d/${encodeURIComponent(SHEET_ID)}/gviz/tq?gid=${encodeURIComponent(SHEET_GID)}&headers=1&tqx=${encodeURIComponent('out:json;responseHandler:tinaReceive')}&_=${Date.now()}`;s.onerror=showError;document.head.appendChild(s);setTimeout(showError,12000);
</script></body></html>
